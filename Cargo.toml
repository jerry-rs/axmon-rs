[package]
name = "axmon"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "axmon"
path = "src/main.rs"

[dependencies]
anyhow = { version = "1" }
async-trait = { version = "0.1" }
axum = { version = "0.8", features = ["ws"] }
bollard = { version = "0.21" }
futures-util = "0.3"
nvml-wrapper = { version = "0.12" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
sysinfo = { version = "0.39",features=["linux-netdevs"] }
tokio = { version = "1", features = ["full"] }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rust-embed = { version = "8", features = ["axum-ex","mime-guess"] }

# netlink 的 INET_DIAG 接口只有 Linux 有（ss 命令同款），
# 依赖限定在 Linux target 下，macOS 上开发走 stub 分支。
[target.'cfg(target_os = "linux")'.dependencies]
netlink-sys = "0.8"
netlink-packet-core = "0.7"
netlink-packet-sock-diag = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
